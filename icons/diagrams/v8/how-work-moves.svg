<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2800" viewBox="0 0 1400 2800" role="img">
  <rect width="1400" height="2800" fill="#0C1016"/>
  <text x="64" y="140" font-family="Georgia, Times, serif" font-size="144" fill="#E2C36A">How work moves</text>
  <text x="64" y="240" font-family="Georgia, Times, serif" font-size="68" fill="#B8B09C">One row at a time.</text>
  <text x="64" y="360" font-family="Georgia, Times, serif" font-size="56" letter-spacing="8" fill="#8A8270">1  CAPTURE</text>
  <rect x="64" y="396" width="1272" height="380" rx="32" fill="#1A1610" stroke="#E8B84A" stroke-width="6"/>
  <text x="700" y="560" text-anchor="middle" font-family="Georgia, Times, serif" font-size="128" fill="#F3E6C0">Inbox</text>
  <text x="700" y="680" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#C4B48A">Then Command Center</text>
  <text x="700" y="870" text-anchor="middle" font-family="Georgia, Times, serif" font-size="112" fill="#8A8270">↓</text>
  <text x="64" y="980" font-family="Georgia, Times, serif" font-size="56" letter-spacing="8" fill="#8A8270">2  ROUTE</text>
  <rect x="64" y="1016" width="1272" height="540" rx="32" fill="#141810" stroke="#D4B45A" stroke-width="6"/>
  <text x="700" y="1160" text-anchor="middle" font-family="Georgia, Times, serif" font-size="88" fill="#F3E6C0">Route → then Status</text>
  <text x="700" y="1270" text-anchor="middle" font-family="Georgia, Times, serif" font-size="68" fill="#D7E6D4">Task  Experiment  Decision</text>
  <text x="700" y="1360" text-anchor="middle" font-family="Georgia, Times, serif" font-size="68" fill="#D7E6F0">Knowledge  Project  People</text>
  <text x="700" y="1470" text-anchor="middle" font-family="Georgia, Times, serif" font-size="68" fill="#C4B48A">Park or Drop. Then leave.</text>
  <text x="700" y="1670" text-anchor="middle" font-family="Georgia, Times, serif" font-size="112" fill="#8A8270">↓</text>
  <text x="64" y="1780" font-family="Georgia, Times, serif" font-size="56" letter-spacing="8" fill="#8A8270">3  WORK</text>
  <rect x="64" y="1816" width="1272" height="360" rx="32" fill="#10161C" stroke="#6EA8C9" stroke-width="6"/>
  <text x="700" y="1970" text-anchor="middle" font-family="Georgia, Times, serif" font-size="88" fill="#D7E6F0">Work on that row</text>
  <text x="700" y="2080" text-anchor="middle" font-family="Georgia, Times, serif" font-size="68" fill="#B8B09C">Do not add an agent</text>
  <text x="700" y="2280" text-anchor="middle" font-family="Georgia, Times, serif" font-size="112" fill="#8A8270">↓</text>
  <text x="64" y="2390" font-family="Georgia, Times, serif" font-size="56" letter-spacing="8" fill="#8A8270">4  SHIP</text>
  <rect x="64" y="2426" width="1272" height="300" rx="32" fill="#101612" stroke="#7D9A78" stroke-width="6"/>
  <text x="700" y="2550" text-anchor="middle" font-family="Georgia, Times, serif" font-size="88" fill="#D7E6D4">Thin slice. Log it.</text>
  <text x="700" y="2650" text-anchor="middle" font-family="Georgia, Times, serif" font-size="60" fill="#B8B09C">Choice = Decision. Test = Experiment.</text>
</svg>
