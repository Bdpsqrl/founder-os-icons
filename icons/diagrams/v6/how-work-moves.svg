<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1680" viewBox="0 0 1080 1680" role="img">
  <rect width="1080" height="1680" fill="#0C1016"/>
  <text x="64" y="78" font-family="Georgia, Times, serif" font-size="52" fill="#E2C36A">How work moves</text>
  <text x="64" y="128" font-family="Georgia, Times, serif" font-size="26" fill="#B8B09C">Morning path. One row at a time.</text>
  <text x="64" y="200" font-family="Georgia, Times, serif" font-size="20" letter-spacing="4" fill="#8A8270">1  CAPTURE</text>
  <rect x="64" y="220" width="952" height="200" rx="22" fill="#1A1610" stroke="#E8B84A" stroke-width="3"/>
  <text x="540" y="292" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#F3E6C0">Inbox</text>
  <text x="540" y="340" text-anchor="middle" font-family="Georgia, Times, serif" font-size="26" fill="#C4B48A">One door. Nothing else is capture.</text>
  <text x="540" y="382" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#8A8270">Then open Command Center.</text>
  <text x="540" y="460" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <text x="64" y="520" font-family="Georgia, Times, serif" font-size="20" letter-spacing="4" fill="#8A8270">2  ROUTE THE ROW</text>
  <rect x="64" y="540" width="952" height="320" rx="22" fill="#141810" stroke="#D4B45A" stroke-width="3"/>
  <text x="540" y="600" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#F3E6C0">Set Route → then Status. Leave.</text>
  <text x="540" y="652" text-anchor="middle" font-family="Georgia, Times, serif" font-size="26" fill="#D7E6D4">Task · Experiment · Decision · Knowledge</text>
  <text x="540" y="696" text-anchor="middle" font-family="Georgia, Times, serif" font-size="26" fill="#D7E6F0">Project · People · Park · Drop</text>
  <text x="540" y="752" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#C4B48A">Age over 7 days: process, park, or drop</text>
  <text x="540" y="796" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#C4B48A">before deep work. Knowledge → Librarian.</text>
  <text x="540" y="900" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <text x="64" y="960" font-family="Georgia, Times, serif" font-size="20" letter-spacing="4" fill="#8A8270">3  WORK IN THE DATABASE</text>
  <rect x="64" y="980" width="952" height="280" rx="22" fill="#10161C" stroke="#6EA8C9" stroke-width="3"/>
  <text x="540" y="1044" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#D7E6F0">Do the work on the destination row.</text>
  <text x="540" y="1096" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#B8B09C">Task / Project / OKR · Experiment / Decision</text>
  <text x="540" y="1140" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#B8B09C">Knowledge / Meeting · Research writes notes</text>
  <text x="540" y="1188" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#F0D4B0">Engineering: eval · lint · split. Do not add an agent.</text>
  <text x="540" y="1300" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <text x="64" y="1360" font-family="Georgia, Times, serif" font-size="20" letter-spacing="4" fill="#8A8270">4  SHIP AND FILE</text>
  <rect x="64" y="1380" width="952" height="220" rx="22" fill="#101612" stroke="#7D9A78" stroke-width="3"/>
  <text x="540" y="1448" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#D7E6D4">Thin slice. Log the result.</text>
  <text x="540" y="1500" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#B8B09C">Choice → Decision. Test → Experiment.</text>
  <text x="540" y="1548" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#B8B09C">Weekly update: draft from databases, then edit.</text>
</svg>
