<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1720" viewBox="0 0 1080 1720" role="img">
  <rect width="1080" height="1720" fill="#0C1016"/>
  <text x="56" y="88" font-family="Georgia, Times, serif" font-size="56" fill="#E2C36A">How we ship</text>
  <text x="56" y="140" font-family="Georgia, Times, serif" font-size="28" fill="#B8B09C">Thin slice. Log the result. Do not add an agent.</text>
  <rect x="56" y="188" width="968" height="120" rx="22" fill="#1A1610" stroke="#E8B84A" stroke-width="3"/>
  <text x="540" y="264" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#F3E6C0">Inbox</text>
  <text x="540" y="340" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <rect x="56" y="368" width="968" height="140" rx="22" fill="#141810" stroke="#D4B45A" stroke-width="3"/>
  <text x="540" y="430" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#F3E6C0">Project only if metric + end state</text>
  <text x="540" y="476" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#C4B48A">Else Task only, linked to a Project</text>
  <text x="540" y="548" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <rect x="56" y="576" width="460" height="160" rx="22" fill="#16141C" stroke="#9B7EC8" stroke-width="3"/>
  <text x="286" y="644" text-anchor="middle" font-family="Georgia, Times, serif" font-size="30" fill="#E6D7F0">Choice?</text>
  <text x="286" y="694" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#B09AC4">Decision first</text>
  <rect x="564" y="576" width="460" height="160" rx="22" fill="#1A1610" stroke="#C9843A" stroke-width="3"/>
  <text x="794" y="644" text-anchor="middle" font-family="Georgia, Times, serif" font-size="30" fill="#F0D4B0">Test?</text>
  <text x="794" y="694" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#C4B48A">Experiment first</text>
  <text x="540" y="780" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <rect x="56" y="808" width="968" height="120" rx="22" fill="#10161C" stroke="#6EA8C9" stroke-width="3"/>
  <text x="540" y="884" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#D7E6F0">Split into Tasks. P0 scarce.</text>
  <text x="540" y="968" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <rect x="56" y="996" width="968" height="140" rx="22" fill="#101612" stroke="#7D9A78" stroke-width="3"/>
  <text x="540" y="1058" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#D7E6D4">Ship a thin slice. Log it.</text>
  <text x="540" y="1108" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#9AAB96">On the Experiment or Project</text>
  <text x="540" y="1188" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <rect x="56" y="1216" width="968" height="180" rx="22" fill="#141010" stroke="#8A5A5A" stroke-width="3"/>
  <text x="540" y="1284" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#D8B0B0">Miss? Patch the lowest object.</text>
  <text x="540" y="1338" text-anchor="middle" font-family="Georgia, Times, serif" font-size="26" fill="#C4B48A">Re-run once. Do not add an agent.</text>
  <text x="540" y="1480" text-anchor="middle" font-family="Georgia, Times, serif" font-size="26" fill="#8A8270">No next action → archive or pause</text>
  <text x="540" y="1530" text-anchor="middle" font-family="Georgia, Times, serif" font-size="26" fill="#8A8270">Repeats → write the six-line workflow first</text>
</svg>
