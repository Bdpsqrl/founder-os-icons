<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1760" viewBox="0 0 1080 1760" role="img">
  <rect width="1080" height="1760" fill="#0C1016"/>
  <text x="56" y="88" font-family="Georgia, Times, serif" font-size="56" fill="#E2C36A">Inbox</text>
  <text x="56" y="140" font-family="Georgia, Times, serif" font-size="28" fill="#B8B09C">One door. Route the row. Do not work here.</text>
  <rect x="56" y="188" width="968" height="130" rx="22" fill="#1A1610" stroke="#E8B84A" stroke-width="3"/>
  <text x="540" y="268" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#F3E6C0">Read Type and age</text>
  <text x="540" y="350" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#8A8270">↓</text>
  <rect x="56" y="382" width="968" height="420" rx="22" fill="#141810" stroke="#D4B45A" stroke-width="3"/>
  <text x="540" y="450" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#F3E6C0">Set Route →</text>
  <text x="540" y="510" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#D7E6D4">To-do → Task</text>
  <text x="540" y="556" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#F0D4B0">Hypothesis → Experiment</text>
  <text x="540" y="602" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#E6D7F0">Choice → Decision</text>
  <text x="540" y="648" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#D7E6F0">Learn item → Knowledge + Librarian</text>
  <text x="540" y="694" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#C4B48A">Not now → Park   Noise → Drop</text>
  <text x="540" y="740" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#B8B09C">Person → People   Bet → Project</text>
  <text x="540" y="836" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#8A8270">↓</text>
  <rect x="56" y="868" width="968" height="160" rx="22" fill="#10161C" stroke="#6EA8C9" stroke-width="3"/>
  <text x="540" y="936" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#D7E6F0">Set Status</text>
  <text x="540" y="986" text-anchor="middle" font-family="Georgia, Times, serif" font-size="26" fill="#9BB4C4">Processed · Parked · Dropped</text>
  <text x="540" y="1072" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#8A8270">↓</text>
  <rect x="56" y="1104" width="968" height="160" rx="22" fill="#101612" stroke="#7D9A78" stroke-width="3"/>
  <text x="540" y="1172" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#D7E6D4">Leave Open Inbox</text>
  <text x="540" y="1222" text-anchor="middle" font-family="Georgia, Times, serif" font-size="26" fill="#9AAB96">Work on the destination row only</text>
  <text x="540" y="1360" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#C4B48A">Age over 7 days: process, park, or drop</text>
  <text x="540" y="1410" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#C4B48A">before deep work. Do not park Knowledge unfiled.</text>
</svg>
