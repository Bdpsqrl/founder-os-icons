<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1680" viewBox="0 0 1080 1680" role="img">
  <rect width="1080" height="1680" fill="#0C1016"/>
  <text x="56" y="88" font-family="Georgia, Times, serif" font-size="56" fill="#E2C36A">Weekly</text>
  <text x="56" y="140" font-family="Georgia, Times, serif" font-size="28" fill="#B8B09C">Sunday evening or Monday morning.</text>
  <rect x="56" y="188" width="968" height="140" rx="22" fill="#10161C" stroke="#6EA8C9" stroke-width="3"/>
  <text x="540" y="248" text-anchor="middle" font-family="Georgia, Times, serif" font-size="30" fill="#D7E6F0">Draft founder update</text>
  <text x="540" y="292" text-anchor="middle" font-family="Georgia, Times, serif" font-size="22" fill="#9BB4C4">Projects · Experiments · Meetings · Decisions · OKRs</text>
  <text x="540" y="368" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <rect x="56" y="396" width="968" height="140" rx="22" fill="#1A1610" stroke="#E8B84A" stroke-width="3"/>
  <text x="540" y="456" text-anchor="middle" font-family="Georgia, Times, serif" font-size="30" fill="#F3E6C0">Human edits. Then file.</text>
  <text x="540" y="500" text-anchor="middle" font-family="Georgia, Times, serif" font-size="22" fill="#C4B48A">Fundraising and Finance. Do not send raw.</text>
  <text x="540" y="576" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <rect x="56" y="604" width="968" height="120" rx="22" fill="#101612" stroke="#7D9A78" stroke-width="3"/>
  <text x="540" y="678" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#D7E6D4">Name one shipping commitment</text>
  <text x="540" y="764" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <rect x="56" y="792" width="968" height="200" rx="22" fill="#141810" stroke="#D4B45A" stroke-width="3"/>
  <text x="540" y="860" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#F3E6C0">Close and audit</text>
  <text x="540" y="908" text-anchor="middle" font-family="Georgia, Times, serif" font-size="22" fill="#C4B48A">Experiments with a Result · Decision revisits</text>
  <text x="540" y="952" text-anchor="middle" font-family="Georgia, Times, serif" font-size="22" fill="#C4B48A">Pause work with no next action</text>
  <text x="540" y="1036" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <rect x="56" y="1064" width="968" height="220" rx="22" fill="#141010" stroke="#8A5A5A" stroke-width="3"/>
  <text x="540" y="1132" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#D8B0B0">Orphan audit</text>
  <text x="540" y="1180" text-anchor="middle" font-family="Georgia, Times, serif" font-size="22" fill="#C4B48A">Project with no Product · Task with no Project</text>
  <text x="540" y="1224" text-anchor="middle" font-family="Georgia, Times, serif" font-size="22" fill="#C4B48A">Agent with no Skill · Live cadence with no Live skill</text>
  <text x="540" y="1380" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#8A8270">Patch at most one Live skill.</text>
  <text x="540" y="1428" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#8A8270">Trigger stays Manual if unread output would fail.</text>
</svg>
