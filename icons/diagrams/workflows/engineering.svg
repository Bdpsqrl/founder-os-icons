<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1680" viewBox="0 0 1080 1680" role="img">
  <rect width="1080" height="1680" fill="#0C1016"/>
  <text x="56" y="88" font-family="Georgia, Times, serif" font-size="56" fill="#E2C36A">Engineering</text>
  <text x="56" y="140" font-family="Georgia, Times, serif" font-size="28" fill="#B8B09C">Change the artefact. Score it. Do not invent an agent.</text>
  <rect x="56" y="188" width="968" height="140" rx="22" fill="#1A1610" stroke="#C9843A" stroke-width="3"/>
  <text x="540" y="248" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#F0D4B0">P0 on GI or Compass</text>
  <text x="540" y="292" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#C4B48A">Work the Task / Project row</text>
  <text x="540" y="368" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <rect x="56" y="396" width="460" height="180" rx="22" fill="#16141C" stroke="#9B7EC8" stroke-width="3"/>
  <text x="286" y="468" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#E6D7F0">Choice → Framer</text>
  <text x="286" y="518" text-anchor="middle" font-family="Georgia, Times, serif" font-size="22" fill="#B09AC4">Then a Decision row</text>
  <rect x="564" y="396" width="460" height="180" rx="22" fill="#1A1610" stroke="#C9843A" stroke-width="3"/>
  <text x="794" y="468" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" fill="#F0D4B0">Test → Experiment</text>
  <text x="794" y="518" text-anchor="middle" font-family="Georgia, Times, serif" font-size="22" fill="#C4B48A">Then ship the slice</text>
  <text x="540" y="620" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <rect x="56" y="648" width="968" height="160" rx="22" fill="#101612" stroke="#7D9A78" stroke-width="3"/>
  <text x="540" y="716" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#D7E6D4">Ship. Log the result.</text>
  <text x="540" y="764" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#9AAB96">Best Practice may propose an Artefacts patch</text>
  <text x="540" y="852" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <rect x="56" y="880" width="968" height="180" rx="22" fill="#10161C" stroke="#6EA8C9" stroke-width="3"/>
  <text x="540" y="948" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#D7E6F0">GI pipeline change?</text>
  <text x="540" y="1000" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#9BB4C4">GI eval scores. It does not edit the pipeline.</text>
  <text x="540" y="1104" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">↓</text>
  <rect x="56" y="1132" width="968" height="160" rx="22" fill="#141010" stroke="#8A5A5A" stroke-width="3"/>
  <text x="540" y="1200" text-anchor="middle" font-family="Georgia, Times, serif" font-size="30" fill="#D8B0B0">Miss → patch lowest object</text>
  <text x="540" y="1248" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#C4B48A">Re-run once. Do not add an agent.</text>
  <text x="540" y="1380" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#8A8270">Pulse flags stall. Verifier closes a Learn loop.</text>
  <text x="540" y="1428" text-anchor="middle" font-family="Georgia, Times, serif" font-size="24" fill="#8A8270">All Engineering agents are Draft.</text>
</svg>
