<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1480" viewBox="0 0 1080 1480" role="img">
  <rect width="1080" height="1480" fill="#0C1016"/>
  <text x="36" y="120" font-family="Georgia, Times, serif" font-size="110" fill="#E2C36A">Learn</text>
  <text x="36" y="200" font-family="Georgia, Times, serif" font-size="38" fill="#B8B09C">Only when a live project is blocked by a skill gap.</text>
  <rect x="36" y="250" width="1008" height="200" rx="30" fill="#1A1610" stroke="#C9843A" stroke-width="5"/>
  <text x="540" y="358" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#F0D4B0">Name the gap on a live Project</text>
  <text x="540" y="500" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="540" width="1008" height="240" rx="30" fill="#101612" stroke="#7D9A78" stroke-width="5"/>
  <text x="540" y="634" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#D7E6D4">Open Learning Studio Now</text>
  <text x="540" y="702" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#9AAB96">One loop. About an hour. Not two.</text>
  <text x="540" y="830" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="870" width="1008" height="240" rx="30" fill="#10161C" stroke="#6EA8C9" stroke-width="5"/>
  <text x="540" y="964" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#D7E6F0">Use it on the linked Task</text>
  <text x="540" y="1032" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#9BB4C4">Pass, Fail, or Split from real evidence.</text>
  <text x="540" y="1160" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="1200" width="1008" height="200" rx="30" fill="#141810" stroke="#D4B45A" stroke-width="5"/>
  <text x="540" y="1308" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#F3E6C0">Close the loop. Do not start another.</text>
</svg>
