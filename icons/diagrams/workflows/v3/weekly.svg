<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1828" viewBox="0 0 1080 1828" role="img">
  <rect width="1080" height="1828" fill="#0C1016"/>
  <text x="36" y="120" font-family="Georgia, Times, serif" font-size="110" fill="#E2C36A">Weekly</text>
  <text x="36" y="200" font-family="Georgia, Times, serif" font-size="38" fill="#B8B09C">Sunday evening or Monday morning.</text>
  <rect x="36" y="240" width="1008" height="240" rx="30" fill="#10161C" stroke="#6EA8C9" stroke-width="5"/>
  <text x="540" y="334" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#D7E6F0">Draft the founder update from the databases</text>
  <text x="540" y="402" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#9BB4C4">Projects, Experiments, Meetings, Decisions, OKRs.</text>
  <text x="540" y="526" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="562" width="1008" height="220" rx="30" fill="#1A1610" stroke="#E8B84A" stroke-width="5"/>
  <text x="540" y="646" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#F3E6C0">You edit it. Then file it.</text>
  <text x="540" y="714" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#C4B48A">Do not send a raw draft to investors.</text>
  <text x="540" y="828" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="864" width="1008" height="180" rx="30" fill="#101612" stroke="#7D9A78" stroke-width="5"/>
  <text x="540" y="962" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#D7E6D4">Name one shipping promise for the week</text>
  <text x="540" y="1090" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="1126" width="1008" height="260" rx="30" fill="#141810" stroke="#D4B45A" stroke-width="5"/>
  <text x="540" y="1230" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#F3E6C0">Close finished tests and due Decisions</text>
  <text x="540" y="1298" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#C4B48A">Pause anything with no next action.</text>
  <text x="540" y="1432" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="1468" width="1008" height="280" rx="30" fill="#141010" stroke="#8A5A5A" stroke-width="5"/>
  <text x="540" y="1558" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#D8B0B0">Find orphans and fix them</text>
  <text x="540" y="1616" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#C4B48A">Project with no Product. Task with no Project.</text>
  <text x="540" y="1674" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#C4B48A">Agent with no written skill.</text>
</svg>
