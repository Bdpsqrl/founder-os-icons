<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1140" viewBox="0 0 1080 1140" role="img">
  <rect width="1080" height="1140" fill="#0C1016"/>
  <text x="36" y="110" font-family="Georgia, Times, serif" font-size="64" fill="#E2C36A">After a material choice</text>
  <text x="36" y="190" font-family="Georgia, Times, serif" font-size="38" fill="#B8B09C">Write the Decision before you build.</text>
  <rect x="36" y="240" width="1008" height="180" rx="30" fill="#16141C" stroke="#9B7EC8" stroke-width="5"/>
  <text x="540" y="338" text-anchor="middle" font-family="Georgia, Times, serif" font-size="48" fill="#E6D7F0">What is the situation?</text>
  <text x="540" y="470" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="510" width="1008" height="220" rx="30" fill="#16141C" stroke="#9B7EC8" stroke-width="5"/>
  <text x="540" y="594" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#E6D7F0">Options, the one you picked,</text>
  <text x="540" y="662" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#B09AC4">and why you picked it.</text>
  <text x="540" y="780" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="820" width="1008" height="240" rx="30" fill="#1A1610" stroke="#E8B84A" stroke-width="5"/>
  <text x="540" y="914" text-anchor="middle" font-family="Georgia, Times, serif" font-size="44" fill="#F3E6C0">Set a date to look again</text>
  <text x="540" y="982" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#C4B48A">On that date: keep, replace, or drop it.</text>
</svg>
