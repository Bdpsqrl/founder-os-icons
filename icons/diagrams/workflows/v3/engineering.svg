<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1848" viewBox="0 0 1080 1848" role="img">
  <rect width="1080" height="1848" fill="#0C1016"/>
  <text x="36" y="120" font-family="Georgia, Times, serif" font-size="88" fill="#E2C36A">Engineering</text>
  <text x="36" y="200" font-family="Georgia, Times, serif" font-size="36" fill="#B8B09C">Change the product. Score the change. Do not invent an agent.</text>
  <rect x="36" y="240" width="1008" height="220" rx="30" fill="#1A1610" stroke="#C9843A" stroke-width="5"/>
  <text x="540" y="324" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#F0D4B0">Open the important GI or Compass task</text>
  <text x="540" y="392" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#C4B48A">Work on that Task or Project row.</text>
  <text x="540" y="506" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="542" width="1008" height="240" rx="30" fill="#16141C" stroke="#9B7EC8" stroke-width="5"/>
  <text x="540" y="636" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#E6D7F0">Choice or test first</text>
  <text x="540" y="704" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#B09AC4">Decision before a choice. Experiment before a test.</text>
  <text x="540" y="828" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="864" width="1008" height="220" rx="30" fill="#101612" stroke="#7D9A78" stroke-width="5"/>
  <text x="540" y="948" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#D7E6D4">Ship a small change and write the result</text>
  <text x="540" y="1016" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#9AAB96">Best Practice may suggest an Artefacts edit.</text>
  <text x="540" y="1130" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="1166" width="1008" height="240" rx="30" fill="#10161C" stroke="#6EA8C9" stroke-width="5"/>
  <text x="540" y="1260" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#D7E6F0">Changing the GI pipeline?</text>
  <text x="540" y="1328" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#9BB4C4">Score the Evaluation Set. Do not edit the pipeline from the score.</text>
  <text x="540" y="1452" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="1488" width="1008" height="240" rx="30" fill="#141010" stroke="#8A5A5A" stroke-width="5"/>
  <text x="540" y="1582" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#D8B0B0">If it missed, fix the written steps</text>
  <text x="540" y="1650" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#C4B48A">Run once more. Do not add an agent.</text>
  <text x="540" y="1798" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#8A8270">Every Engineering agent is still Draft.</text>
</svg>
