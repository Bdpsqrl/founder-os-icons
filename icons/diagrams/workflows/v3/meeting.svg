<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1250" viewBox="0 0 1080 1250" role="img">
  <rect width="1080" height="1250" fill="#0C1016"/>
  <text x="36" y="120" font-family="Georgia, Times, serif" font-size="80" fill="#E2C36A">After a meeting</text>
  <text x="36" y="200" font-family="Georgia, Times, serif" font-size="40" fill="#B8B09C">Write this down before you forget.</text>
  <rect x="36" y="250" width="1008" height="180" rx="30" fill="#1A1610" stroke="#E8B84A" stroke-width="5"/>
  <text x="540" y="348" text-anchor="middle" font-family="Georgia, Times, serif" font-size="44" fill="#F3E6C0">Confirm the Meetings row exists</text>
  <text x="540" y="480" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="520" width="1008" height="240" rx="30" fill="#101612" stroke="#7D9A78" stroke-width="5"/>
  <text x="540" y="614" text-anchor="middle" font-family="Georgia, Times, serif" font-size="44" fill="#D7E6D4">Each promise becomes a Task</text>
  <text x="540" y="682" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#9AAB96">Link the meeting. Do not invent promises.</text>
  <text x="540" y="810" text-anchor="middle" font-family="Georgia, Times, serif" font-size="72" fill="#8A8270">↓</text>
  <rect x="36" y="850" width="1008" height="260" rx="30" fill="#16141C" stroke="#9B7EC8" stroke-width="5"/>
  <text x="540" y="930" text-anchor="middle" font-family="Georgia, Times, serif" font-size="44" fill="#E6D7F0">Did you choose a product direction?</text>
  <text x="540" y="988" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#B09AC4">Write a Decision now.</text>
  <text x="540" y="1046" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#B09AC4">Do not hide it in meeting notes.</text>
  <text x="540" y="1190" text-anchor="middle" font-family="Georgia, Times, serif" font-size="34" fill="#8A8270">Quoted words must be exact.</text>
</svg>
