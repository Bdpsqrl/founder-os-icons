<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2020" viewBox="0 0 1080 2020" role="img">
  <rect width="1080" height="2020" fill="#0C1016"/>
  <text x="40" y="120" font-family="Georgia, Times, serif" font-size="96" fill="#E2C36A">Engineering</text>
  <text x="40" y="200" font-family="Georgia, Times, serif" font-size="36" fill="#B8B09C">Change the artefact. Score it. Do not invent an agent.</text>
  <rect x="40" y="250" width="1000" height="210" rx="28" fill="#1A1610" stroke="#C9843A" stroke-width="4"/>
  <text x="540" y="340" text-anchor="middle" font-family="Georgia, Times, serif" font-size="48" fill="#F0D4B0">P0 on GI or Compass</text>
  <text x="540" y="410" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#C4B48A">Work the Task / Project row</text>
  <text x="540" y="520" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="560" width="470" height="230" rx="28" fill="#16141C" stroke="#9B7EC8" stroke-width="4"/>
  <text x="275" y="655" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#E6D7F0">Choice → Framer</text>
  <text x="275" y="730" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#B09AC4">Then a Decision row</text>
  <rect x="570" y="560" width="470" height="230" rx="28" fill="#1A1610" stroke="#C9843A" stroke-width="4"/>
  <text x="805" y="655" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#F0D4B0">Test → Experiment</text>
  <text x="805" y="730" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#C4B48A">Then ship the slice</text>
  <text x="540" y="850" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="890" width="1000" height="230" rx="28" fill="#101612" stroke="#7D9A78" stroke-width="4"/>
  <text x="540" y="990" text-anchor="middle" font-family="Georgia, Times, serif" font-size="48" fill="#D7E6D4">Ship. Log the result.</text>
  <text x="540" y="1060" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#9AAB96">Best Practice may propose an Artefacts patch</text>
  <text x="540" y="1180" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="1220" width="1000" height="230" rx="28" fill="#10161C" stroke="#6EA8C9" stroke-width="4"/>
  <text x="540" y="1320" text-anchor="middle" font-family="Georgia, Times, serif" font-size="48" fill="#D7E6F0">GI pipeline change?</text>
  <text x="540" y="1390" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#9BB4C4">GI eval scores. It does not edit the pipeline.</text>
  <text x="540" y="1510" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="1550" width="1000" height="230" rx="28" fill="#141010" stroke="#8A5A5A" stroke-width="4"/>
  <text x="540" y="1650" text-anchor="middle" font-family="Georgia, Times, serif" font-size="44" fill="#D8B0B0">Miss → patch lowest object</text>
  <text x="540" y="1720" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#C4B48A">Re-run once. Do not add an agent.</text>
  <text x="540" y="1890" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#8A8270">Pulse flags stall. Verifier closes a Learn loop.</text>
  <text x="540" y="1940" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#8A8270">All Engineering agents are Draft.</text>
</svg>
