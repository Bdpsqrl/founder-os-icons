<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2040" viewBox="0 0 1080 2040" role="img">
  <rect width="1080" height="2040" fill="#0C1016"/>
  <text x="40" y="120" font-family="Georgia, Times, serif" font-size="104" fill="#E2C36A">Weekly</text>
  <text x="40" y="200" font-family="Georgia, Times, serif" font-size="40" fill="#B8B09C">Sunday evening or Monday morning.</text>
  <rect x="40" y="250" width="1000" height="210" rx="28" fill="#10161C" stroke="#6EA8C9" stroke-width="4"/>
  <text x="540" y="340" text-anchor="middle" font-family="Georgia, Times, serif" font-size="48" fill="#D7E6F0">Draft founder update</text>
  <text x="540" y="410" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#9BB4C4">Projects · Experiments · Meetings · Decisions · OKRs</text>
  <text x="540" y="520" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="560" width="1000" height="210" rx="28" fill="#1A1610" stroke="#E8B84A" stroke-width="4"/>
  <text x="540" y="650" text-anchor="middle" font-family="Georgia, Times, serif" font-size="48" fill="#F3E6C0">Human edits. Then file.</text>
  <text x="540" y="720" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#C4B48A">Fundraising and Finance. Do not send raw.</text>
  <text x="540" y="830" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="870" width="1000" height="160" rx="28" fill="#101612" stroke="#7D9A78" stroke-width="4"/>
  <text x="540" y="975" text-anchor="middle" font-family="Georgia, Times, serif" font-size="44" fill="#D7E6D4">Name one shipping commitment</text>
  <text x="540" y="1090" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="1130" width="1000" height="270" rx="28" fill="#141810" stroke="#D4B45A" stroke-width="4"/>
  <text x="540" y="1220" text-anchor="middle" font-family="Georgia, Times, serif" font-size="48" fill="#F3E6C0">Close and audit</text>
  <text x="540" y="1290" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#C4B48A">Experiments with a Result · Decision revisits</text>
  <text x="540" y="1350" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#C4B48A">Pause work with no next action</text>
  <text x="540" y="1460" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="1500" width="1000" height="290" rx="28" fill="#141010" stroke="#8A5A5A" stroke-width="4"/>
  <text x="540" y="1590" text-anchor="middle" font-family="Georgia, Times, serif" font-size="48" fill="#D8B0B0">Orphan audit</text>
  <text x="540" y="1660" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#C4B48A">Project with no Product · Task with no Project</text>
  <text x="540" y="1720" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#C4B48A">Agent with no Skill · Live cadence with no Live skill</text>
  <text x="540" y="1900" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#8A8270">Patch at most one Live skill.</text>
  <text x="540" y="1950" text-anchor="middle" font-family="Georgia, Times, serif" font-size="32" fill="#8A8270">Trigger stays Manual if unread output would fail.</text>
</svg>
