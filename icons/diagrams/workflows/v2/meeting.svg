<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1380" viewBox="0 0 1080 1380" role="img">
  <rect width="1080" height="1380" fill="#0C1016"/>
  <text x="40" y="120" font-family="Georgia, Times, serif" font-size="88" fill="#E2C36A">After a meeting</text>
  <text x="40" y="200" font-family="Georgia, Times, serif" font-size="44" fill="#B8B09C">Before context fades.</text>
  <rect x="40" y="260" width="1000" height="180" rx="28" fill="#1A1610" stroke="#E8B84A" stroke-width="4"/>
  <text x="540" y="375" text-anchor="middle" font-family="Georgia, Times, serif" font-size="52" fill="#F3E6C0">Confirm the Meetings row</text>
  <text x="540" y="500" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="540" width="1000" height="230" rx="28" fill="#101612" stroke="#7D9A78" stroke-width="4"/>
  <text x="540" y="640" text-anchor="middle" font-family="Georgia, Times, serif" font-size="52" fill="#D7E6D4">Each next action → Task</text>
  <text x="540" y="720" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#9AAB96">Link the meeting. No invented commitments.</text>
  <text x="540" y="830" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="870" width="1000" height="250" rx="28" fill="#16141C" stroke="#9B7EC8" stroke-width="4"/>
  <text x="540" y="970" text-anchor="middle" font-family="Georgia, Times, serif" font-size="52" fill="#E6D7F0">Product or model choice?</text>
  <text x="540" y="1050" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#B09AC4">Write a Decision now. Do not bury it.</text>
  <text x="540" y="1220" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">Quotes must be verbatim.</text>
  <text x="540" y="1280" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">Agent: Meeting follow-up. Still Draft.</text>
</svg>
