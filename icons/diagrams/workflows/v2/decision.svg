<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1260" viewBox="0 0 1080 1260" role="img">
  <rect width="1080" height="1260" fill="#0C1016"/>
  <text x="40" y="110" font-family="Georgia, Times, serif" font-size="72" fill="#E2C36A">After a material choice</text>
  <text x="40" y="190" font-family="Georgia, Times, serif" font-size="40" fill="#B8B09C">Write the Decision before you implement.</text>
  <rect x="40" y="250" width="1000" height="180" rx="28" fill="#16141C" stroke="#9B7EC8" stroke-width="4"/>
  <text x="540" y="365" text-anchor="middle" font-family="Georgia, Times, serif" font-size="56" fill="#E6D7F0">Context</text>
  <text x="540" y="490" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="530" width="1000" height="180" rx="28" fill="#16141C" stroke="#9B7EC8" stroke-width="4"/>
  <text x="540" y="645" text-anchor="middle" font-family="Georgia, Times, serif" font-size="48" fill="#E6D7F0">Options · chosen option · why</text>
  <text x="540" y="770" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="810" width="1000" height="230" rx="28" fill="#1A1610" stroke="#E8B84A" stroke-width="4"/>
  <text x="540" y="910" text-anchor="middle" font-family="Georgia, Times, serif" font-size="52" fill="#F3E6C0">Revisit date required</text>
  <text x="540" y="990" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#C4B48A">Keep, supersede, or reject on that date</text>
  <text x="540" y="1160" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#8A8270">Framer can frame this in chat. Not a live bot.</text>
</svg>
