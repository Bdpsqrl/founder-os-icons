<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1980" viewBox="0 0 1080 1980" role="img">
  <rect width="1080" height="1980" fill="#0C1016"/>
  <text x="40" y="120" text-anchor="start" font-family="Georgia, Times, serif" font-size="104" fill="#E2C36A">Inbox</text>
  <text x="40" y="200" text-anchor="start" font-family="Georgia, Times, serif" font-size="44" fill="#B8B09C">One door. Route the row. Do not work here.</text>
  <rect x="40" y="250" width="1000" height="160" rx="28" fill="#1A1610" stroke="#E8B84A" stroke-width="4"/>
  <text x="540" y="355" text-anchor="middle" font-family="Georgia, Times, serif" font-size="56" fill="#F3E6C0">Read Type and age</text>
  <text x="540" y="470" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="510" width="1000" height="560" rx="28" fill="#141810" stroke="#D4B45A" stroke-width="4"/>
  <text x="540" y="600" text-anchor="middle" font-family="Georgia, Times, serif" font-size="56" fill="#F3E6C0">Set Route →</text>
  <text x="540" y="690" text-anchor="middle" font-family="Georgia, Times, serif" font-size="44" fill="#D7E6D4">To-do → Task</text>
  <text x="540" y="760" text-anchor="middle" font-family="Georgia, Times, serif" font-size="44" fill="#F0D4B0">Hypothesis → Experiment</text>
  <text x="540" y="830" text-anchor="middle" font-family="Georgia, Times, serif" font-size="44" fill="#E6D7F0">Choice → Decision</text>
  <text x="540" y="900" text-anchor="middle" font-family="Georgia, Times, serif" font-size="44" fill="#D7E6F0">Learn → Knowledge + Librarian</text>
  <text x="540" y="970" text-anchor="middle" font-family="Georgia, Times, serif" font-size="44" fill="#C4B48A">Not now → Park    Noise → Drop</text>
  <text x="540" y="1040" text-anchor="middle" font-family="Georgia, Times, serif" font-size="44" fill="#B8B09C">Person → People    Bet → Project</text>
  <text x="540" y="1130" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="1170" width="1000" height="220" rx="28" fill="#10161C" stroke="#6EA8C9" stroke-width="4"/>
  <text x="540" y="1260" text-anchor="middle" font-family="Georgia, Times, serif" font-size="56" fill="#D7E6F0">Set Status</text>
  <text x="540" y="1340" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#9BB4C4">Processed · Parked · Dropped</text>
  <text x="540" y="1440" text-anchor="middle" font-family="Georgia, Times, serif" font-size="64" fill="#8A8270">↓</text>
  <rect x="40" y="1480" width="1000" height="220" rx="28" fill="#101612" stroke="#7D9A78" stroke-width="4"/>
  <text x="540" y="1570" text-anchor="middle" font-family="Georgia, Times, serif" font-size="56" fill="#D7E6D4">Leave Open Inbox</text>
  <text x="540" y="1650" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#9AAB96">Work on the destination row only</text>
  <text x="540" y="1820" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#C4B48A">Age over 7 days: process, park, or drop</text>
  <text x="540" y="1880" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#C4B48A">before deep work. Do not park Knowledge.</text>
</svg>
