<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1680" viewBox="0 0 1080 1680" role="img">
  <rect width="1080" height="1680" fill="#0C1016"/>
  <text x="56" y="88" font-family="Georgia, Times, serif" font-size="56" fill="#E2C36A">Daily</text>
  <text x="56" y="140" font-family="Georgia, Times, serif" font-size="28" fill="#B8B09C">Command Center. Empty Inbox. Ship one slice.</text>
  <rect x="56" y="188" width="968" height="140" rx="22" fill="#1A1610" stroke="#E8B84A" stroke-width="3"/>
  <text x="540" y="274" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#F3E6C0">1  Open Command Center</text>
  <text x="540" y="360" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#8A8270">↓</text>
  <rect x="56" y="392" width="968" height="140" rx="22" fill="#141810" stroke="#D4B45A" stroke-width="3"/>
  <text x="540" y="478" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#F3E6C0">2  Review Morning brief</text>
  <text x="540" y="564" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#8A8270">↓</text>
  <rect x="56" y="596" width="968" height="160" rx="22" fill="#141810" stroke="#D4B45A" stroke-width="3"/>
  <text x="540" y="664" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#F3E6C0">3  Empty Open Inbox</text>
  <text x="540" y="714" text-anchor="middle" font-family="Georgia, Times, serif" font-size="26" fill="#C4B48A">Route → then Status. Leave.</text>
  <text x="540" y="800" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#8A8270">↓</text>
  <rect x="56" y="832" width="968" height="140" rx="22" fill="#10161C" stroke="#6EA8C9" stroke-width="3"/>
  <text x="540" y="918" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#D7E6F0">4  Three tasks. P0 scarce.</text>
  <text x="540" y="1004" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#8A8270">↓</text>
  <rect x="56" y="1036" width="968" height="160" rx="22" fill="#101612" stroke="#7D9A78" stroke-width="3"/>
  <text x="540" y="1104" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#D7E6D4">5  Ship a thin slice</text>
  <text x="540" y="1154" text-anchor="middle" font-family="Georgia, Times, serif" font-size="26" fill="#9AAB96">Log the result on Experiment or Project</text>
  <text x="540" y="1240" text-anchor="middle" font-family="Georgia, Times, serif" font-size="40" fill="#8A8270">↓</text>
  <rect x="56" y="1272" width="968" height="160" rx="22" fill="#121018" stroke="#9B7EC8" stroke-width="3"/>
  <text x="540" y="1340" text-anchor="middle" font-family="Georgia, Times, serif" font-size="36" fill="#E6D7F0">6  Sign off agent drafts</text>
  <text x="540" y="1390" text-anchor="middle" font-family="Georgia, Times, serif" font-size="26" fill="#B09AC4">Accept, patch workflow, or reject</text>
  <text x="540" y="1520" text-anchor="middle" font-family="Georgia, Times, serif" font-size="26" fill="#8A8270">Never invent numbers. Empty = None logged.</text>
</svg>
